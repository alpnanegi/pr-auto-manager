name: PR Auto Close

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-close-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Check and close old PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXCLUDED_USERS: "alpnanegi01"

        run: |
          echo "===================================="
          echo "PR AUTO CLOSE"
          echo "Repository: $REPO"
          echo "Excluded Users: $EXCLUDED_USERS"
          echo "===================================="

          echo "Getting open PRs..."

          gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,title,author,createdAt,headRefName,baseRefName \
            > prs.json

          PR_COUNT=$(jq 'length' prs.json)

          if [ "$PR_COUNT" -eq 0 ]; then
            echo ""
            echo "No open PRs found."
            echo "Nothing to process."
            exit 0
          fi

          NOW=$(date -u +%s)

          echo ""
          echo "===== PR EXECUTION REPORT ====="

          jq -c '.[]' prs.json | while read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_AUTHOR=$(echo "$PR" | jq -r '.author.login')
            CREATED_AT=$(echo "$PR" | jq -r '.createdAt')
            HEAD_BRANCH=$(echo "$PR" | jq -r '.headRefName')
            BASE_BRANCH=$(echo "$PR" | jq -r '.baseRefName')
            PR_TITLE=$(echo "$PR" | jq -r '.title')

            echo ""
            echo "PR Number : #$PR_NUMBER"
            echo "Repository: $REPO"
            echo "Author    : $PR_AUTHOR"
            echo "Branch    : $HEAD_BRANCH"
            echo "Base      : $BASE_BRANCH"

            # Skip excluded users
            if echo ",$EXCLUDED_USERS," | grep -q ",$PR_AUTHOR,"; then
              echo "Action    : SKIPPED"
              echo "Reason    : User is excluded from auto-close"
              continue
            fi

            CREATED_SECONDS=$(date -d "$CREATED_AT" +%s)
            AGE_SECONDS=$((NOW - CREATED_SECONDS))
            AGE_MINUTES=$((AGE_SECONDS / 60))

            echo "Open For  : $AGE_MINUTES minute(s)"

            # 5 minutes = 300 seconds
            if [ "$AGE_SECONDS" -gt 300 ]; then

              echo "Action    : Closing PR #$PR_NUMBER"

              gh pr comment "$PR_NUMBER" \
                --repo "$REPO" \
                --body "Closed automatically because the PR has been open for more than 5 minutes."

              gh pr close "$PR_NUMBER" \
                --repo "$REPO"

              echo "Result    : CLOSED"

              echo ""
              echo "Waiting 2 minutes before creating a new PR..."
              sleep 120

              # Check whether source branch still exists
              if gh api \
                "repos/$REPO/branches/$HEAD_BRANCH" \
                > /dev/null 2>&1; then

                echo "Source branch still exists."
                echo "Creating new PR..."

                NEW_PR_BODY=$(cat <<EOF
Automatically recreated from PR #$PR_NUMBER.

Original PR author: @$PR_AUTHOR
Original PR: #$PR_NUMBER
Original repository: $REPO

The previous PR was automatically closed because it was open for more than 5 minutes.

This PR was created automatically so the work can continue from the same source branch.
EOF
)

                NEW_PR_URL=$(gh pr create \
                  --repo "$REPO" \
                  --base "$BASE_BRANCH" \
                  --head "$HEAD_BRANCH" \
                  --title "$PR_TITLE" \
                  --body "$NEW_PR_BODY")

                echo "New PR created: $NEW_PR_URL"

                # Get new PR number
                NEW_PR_NUMBER=$(echo "$NEW_PR_URL" | grep -o '[0-9]*$')

                echo "New PR Number : #$NEW_PR_NUMBER"
                echo "Original Author: $PR_AUTHOR"

                echo "Adding label 'auto-cloned' to PR #$NEW_PR_NUMBER..."

                gh pr edit "$NEW_PR_NUMBER" \
                  --repo "$REPO" \
                  --add-label "auto-cloned"

                echo "Label 'auto-cloned' added successfully."

                gh pr comment "$NEW_PR_NUMBER" \
                  --repo "$REPO" \
                  --body "Auto-cloned PR for @$PR_AUTHOR. Original PR: #$PR_NUMBER. Original author: @$PR_AUTHOR."

                echo ""
                echo "===== CLONE REPORT ====="
                echo "Original PR : #$PR_NUMBER"
                echo "New PR      : #$NEW_PR_NUMBER"
                echo "Author      : @$PR_AUTHOR"
                echo "Label       : auto-cloned"
                echo "Status      : CREATED"
                echo "========================"

              else

                echo "Source branch '$HEAD_BRANCH' no longer exists."
                echo "New PR was NOT created."

              fi

            else

              echo "Result    : LEFT OPEN"

            fi

          done

          echo ""
          echo "===== PROCESS COMPLETED ====="
